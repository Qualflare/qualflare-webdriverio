name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24, for its npm 11. Dependabot regenerates package-lock.json with
      # npm 11, which dedupes the wildcard `@types/node: *` that the framework
      # packages depend on; npm 10 (Node 20 and 22) then rejects that lockfile as
      # out of sync and every Dependabot PR fails in `npm ci` before it reaches
      # the change it is testing. Node 20 is also EOL as of 2026-04-30.
      #
      # This is the build runtime only. `engines` still allows >=18.20, and the
      # WebdriverIO matrix below picks its own Node per leg -- do not fold this
      # value into those.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Loads every entry of dist/ in BOTH formats. The CJS build once failed
      # with "Class extends value #<Object> is not a constructor" while every
      # other check here passed; see src/interop.ts.
      - run: npx vitest run test/built

  integration:
    name: Integration (real WebdriverIO run) — WebdriverIO ${{ matrix.wdio }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the `peerDependencies["webdriverio"]` range ("^8 || ^9")
        # empirically: a real local-runner run with two workers and headless
        # Chrome, Mocha and Jasmine, on each major. WebdriverIO 8 is still
        # maintained, and it differs in ways that matter here -- spec paths are
        # plain paths rather than file:// URLs, and Jasmine's afterTest reports
        # `passed: true` for a failed expectation.
        include:
          - wdio: '8'
            node: '20'
          - wdio: '9'
            node: '22'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install with the matrix WebdriverIO major
        # package.json is edited with node rather than `npm pkg set`: the
        # runner's npm and a local npm disagreed about that step twice in the
        # sibling repos, each time as an arborist crash naming neither the
        # package nor the conflict. The lockfile is removed because these legs
        # deliberately install a tree it does not describe.
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const major = process.env.WDIO_MAJOR;
            for (const name of Object.keys(pkg.devDependencies)) {
              if (name === "webdriverio" || name.startsWith("@wdio/")) pkg.devDependencies[name] = `^${major}.0.0`;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          rm -f package-lock.json
          npm install --loglevel=error
        env:
          WDIO_MAJOR: ${{ matrix.wdio }}
      - name: Confirm the matrix version is the one actually installed
        # Otherwise two green legs could both be testing the same version.
        run: |
          # Read from disk: webdriverio's exports map does not expose
          # ./package.json, so require('webdriverio/package.json') throws.
          INSTALLED="$(node -p "JSON.parse(require('fs').readFileSync('node_modules/webdriverio/package.json', 'utf8')).version")"
          echo "installed webdriverio: $INSTALLED (matrix asked for ${{ matrix.wdio }}.x)"
          case "$INSTALLED" in
            ${{ matrix.wdio }}.*) ;;
            *) echo "::error::webdriverio $INSTALLED installed, expected ${{ matrix.wdio }}.x"; exit 1 ;;
          esac
      # The fixture loads the package by name from BUILT dist/.
      - run: npm run build
      - run: npm run test:integration

  packaged:
    name: Packaged tarball in a fresh project
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the PACKED tarball into a new WebdriverIO project
        # The tarball, not the working tree, so a broken `files` or `exports`
        # map fails here instead of after publishing: every other job loads the
        # package through a link to this checkout.
        run: |
          TARBALL="$PWD/$(npm pack --silent | tail -1)"
          mkdir -p "$RUNNER_TEMP/consumer"
          cp -R test/integration/fixtures/wdio-project/. "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL" \
            @wdio/cli@9 @wdio/local-runner@9 @wdio/mocha-framework@9 webdriverio@9
      - name: Run it, and assert what the workers wrote
        working-directory: ${{ runner.temp }}/consumer
        run: |
          # The fixture fails on purpose; the report is what is asserted.
          QUALFLARE_RESULTS_DIR=out npx wdio run wdio.conf.mjs || true
          node -e '
            const fs = require("node:fs");
            const files = fs.readdirSync("out").filter((f) => f.endsWith(".json"));
            if (files.length !== 2) throw new Error(`expected 2 reports (one per spec file), got ${files.length}`);
            const reports = files.map((f) => JSON.parse(fs.readFileSync(`out/${f}`, "utf8")));
            const runIds = new Set(reports.map((r) => r.metadata && r.metadata.runId));
            if (runIds.size !== 1) throw new Error(`workers disagree on runId: ${[...runIds].join(", ")}`);
            for (const r of reports) {
              if (r.framework !== "webdriverio") throw new Error(`framework=${r.framework}`);
              if ("config" in r) throw new Error("top-level config key — that is the Playwright-JSON signature");
            }
            const cases = reports.flatMap((r) => r.suites.flatMap((s) => s.cases));
            console.log(`ok: ${files.length} reports, one runId, ${cases.length} case(s)`);
          '

  no-network:
    name: Reporter makes no network calls
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Grep the BUILT bundle for any HTTP client
        # Asserted against the shipped bundle rather than a mock server, on
        # purpose: a sibling repo's mock once implemented an endpoint the real
        # API never served, which hid a broken upload for two releases. A mock
        # can lie about the network; the absence of a client cannot.
        run: |
          if grep -rnE "fetch\(|axios|node-fetch|require\(['\"](http|https|node:http)|from ['\"](http|https|node:http)" \
               dist --include='*.js' --include='*.cjs'; then
            echo "::error::an HTTP client reached the shipped bundle"
            exit 1
          fi
          echo "ok: no HTTP client in dist"
